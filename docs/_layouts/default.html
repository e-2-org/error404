<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
{% include head.html %}

<body class="os-win">
    <script>
    {% include javascript/theme.js %}
    </script>
    <main id="screen" class="desktop">
        {% include menubar.html %}
        <div id="windows"></div>
        {% include dialog.html %}
        {{ content }}
        {% include taskbar.html %}
        <div id="flash" aria-hidden="true"></div>
    </main>
    <div id="debug" hidden></div>
    {% include fullscreen.html %}
    {% include windows.html %}
    {% if site.video_url != "" %}{% include video.html %}{% endif %}
    <script id="timeline-data" type="application/json">{{ site.data.timeline | jsonify }}</script>
    {% include foot.html %}
</body>
</html>
